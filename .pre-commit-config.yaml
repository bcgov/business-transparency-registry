repos:
  # Shared gitleaks rules: https://github.com/bcgov/bcregistry-sre/tree/main/git-hooks
  # Downloads them for .gitleaks.toml to extend (refreshed every 24h); blocks the
  # commit if they can't be downloaded, instead of scanning with no rules.
  - repo: local
    hooks:
      - id: shared-gitleaks-rules
        name: shared gitleaks rules
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          bash -c 'f=.git/info/bcregistry-sre/gitleaks-base.toml;
          [ -n "$(find $f -mmin -1440 2>/dev/null)" ] && exit 0;
          mkdir -p .git/info/bcregistry-sre;
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/bcgov/bcregistry-sre/main/git-hooks/gitleaks-base.toml -o $f.tmp && [ -s $f.tmp ] && mv -f $f.tmp $f && exit 0;
          rm -f $f.tmp;
          [ -f $f ] && echo Could not refresh shared gitleaks rules, using the earlier copy && exit 0;
          echo Shared gitleaks rules missing - check you can reach raw.githubusercontent.com; exit 1'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.3.1
    hooks:
      - id: pyupgrade
        args: ["--py37-plus"]
  - repo: https://github.com/asottile/reorder_python_imports
    rev: v3.9.0
    hooks:
      - id: reorder-python-imports
        name: Reorder Python imports (src, tests)
        files: "^(?!examples/)"
        args: ["--application-directories", "src"]
  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black
        args: # arguments to configure black
          - --line-length=120
          - --exclude="""\.git |
              \.__pycache__

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-implicit-str-concat
        args: # arguments to configure black
          - "--max-line-length=120"

  - repo: https://github.com/peterdemin/pip-compile-multi
    rev: v2.6.2
    hooks:
      - id: pip-compile-multi-verify
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: double-quote-string-fixer
